tensorrt_inference:
  ros__parameters:
    engine_path: ""  # Required; launch engine_path:=/absolute/path/model.engine
    device_id: 0
    image_topic: /camera/image_raw
    result_topic: /inference/results
    max_image_bytes: 6220800  # Includes row padding: height * step, not width * height * 3.
    warmup_iterations: 20
    scale: 0.00392156862745098
    mean: [0.485, 0.456, 0.406]
    stddev: [0.229, 0.224, 0.225]
    output_mode: raw  # raw | classification | both
    top_k: 5
    apply_softmax: true
